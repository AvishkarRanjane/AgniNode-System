; AgniNode gateway - ESP32-WROOM-32E (4 MB), Arduino core 2.0.14
[platformio]
default_envs = esp32gw

[env:esp32gw]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = certs/roots.pem
extra_scripts = pre:scripts/fetch_roots.py
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_ENABLE_PROGMEM=0
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
