; AgniNode safety MCU - STM32G0B1RE (Cortex-M0+), STM32Cube HAL
[platformio]
default_envs = agninode_g0b1

[env:agninode_g0b1]
platform = ststm32@~17.6.0
framework = stm32cube
board = nucleo_g0b1re
board_upload.maximum_size = 524288     ; G0B1RE = 512 KB flash
; Use the installed OpenOCD ST-LINK driver with native SWD transport.
; PlatformIO's stlink uploader selects legacy hla_swd, which OpenOCD 12 removed.
upload_protocol = custom
upload_command = "$PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd" -d2 -s "$PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32g0x.cfg -c "program {$SOURCE} 0x08000000 verify reset; shutdown;"
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -Os
    -Wall
    -Wextra
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
build_src_filter =
    +<*>
    -<buzzer_pin_test.cpp>

[env:buzzer_pin_test]
extends = env:agninode_g0b1
build_src_filter =
    -<*>
    +<buzzer_pin_test.cpp>
